<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <section>
    <h2>Colors from Gmail</h2>
    <p id="status">Not synced yet.</p>
    <button id="sync" type="button">Sync now</button>
  </section>
  <section>
    <h2>Right-click menu</h2>
    <p class="hint">Labels offered under “Add Gmail Label” when you right-click a message.</p>
    <p>
      <button id="menu-all" type="button">Show all</button>
      <button id="menu-none" type="button">Hide all</button>
    </p>
    <div id="menu-labels"></div>
  </section>
  <section>
    <h2>Label colors</h2>
    <p class="hint">
      Change a color here to override the one from Gmail. Labels without a Gmail
      color show in gray.
    </p>
    <table id="labels"></table>
  </section>
  <script src="options.js"></script>
</body>
</html>
